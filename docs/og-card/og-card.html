<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Live-n-Comfort share card</title>
  <!--
    Source for public/images/og-image.jpg (1200 x 630). Not published.
    Interim text card until there is a storefront photo.
    Render: headless Google Chrome at 1200 x 630, then convert the PNG to JPG with sips.
  -->
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      font-weight: 600;
      src: url("../../public/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Work Sans";
      font-weight: 400;
      src: url("../../public/fonts/work-sans-latin-400-normal.woff2") format("woff2");
    }
    :root {
      --accent: #2F4A3A;
      --bg: #F7F3EC;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--accent);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      color: var(--bg);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: 136px;
      line-height: 1;
    }
    p {
      margin: 0;
      font-family: "Work Sans", sans-serif;
      font-weight: 400;
      font-size: 34px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h1>Live-n-Comfort</h1>
  <p>Gifts and stationery on Main Street, Jeffersonville, Vermont</p>
</body>
</html>
